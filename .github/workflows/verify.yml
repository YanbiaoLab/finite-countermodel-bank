name: Verify reproduction records

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-python311:
    name: Required baseline (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild PR 1 from committed snapshots
        run: |
          python3 tools/rebuild_pr1.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Rebuild PR 2 from committed snapshots
        run: |
          python3 tools/rebuild_pr2.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run unified verification suite
        run: |
          python3 tools/verify_all.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  verify-python312:
    name: Additional compatibility (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unified verification suite
        run: python3 tools/verify_all.py
