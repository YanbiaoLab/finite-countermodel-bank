name: Verify reproduction records

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-python311:
    name: Required baseline (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild PR 1 from committed snapshots
        run: |
          python3 tools/rebuild_pr1.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Rebuild PR 2 from committed snapshots
        run: |
          python3 tools/rebuild_pr2.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Rebuild and verify corrected PR 3 from committed snapshot
        run: |
          python3 reproduction/81-finite149-portable-verification/scripts/verify.py --skip-repository-verifier
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Rebuild and verify PR 4 payload and runtime closure
        run: |
          python3 tools/verify_pr4.py --skip-repository-verifier
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify manifests and artifacts
        run: python3 tools/verify_repository.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  verify-python312:
    name: Additional compatibility (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify portable PR 3 correction
        run: python3 reproduction/81-finite149-portable-verification/scripts/verify.py --skip-repository-verifier
      - name: Verify exact PR 4 artifacts
        run: python3 tools/verify_pr4.py --skip-repository-verifier
      - name: Run portable-parser unit tests
        run: python3 -m unittest tests.test_stage81_streaming -v
      - name: Run PR 4 unit tests
        run: python3 -m unittest tests.test_pr4_common -v
