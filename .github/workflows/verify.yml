name: Verify reproduction records

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild PR 1 from committed snapshots
        run: |
          python3 tools/rebuild_pr1.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify manifests and artifacts
        run: python3 tools/verify_repository.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
